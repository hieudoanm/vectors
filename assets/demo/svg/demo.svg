  <rect x="308" y="363" width="12" height="24" rx="2" fill="#e5e5e5">
    <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="1.1s" begin="6.05s" repeatCount="indefinite"/>
  </rect>
