<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img">
  <rect width="1280" height="640" fill="#0b0b0b"/>
  <rect x="12" y="12" width="1256" height="616" rx="28" fill="#141414" stroke="#2e2e2e" stroke-width="2"/>
  <path d="M12 68V40a28 28 0 0 1 28-28h1200a28 28 0 0 1 28 28v28H12Z" fill="#1c1c1c"/>
  <circle cx="56" cy="40" r="8" fill="#ff5f57"/>
  <circle cx="84" cy="40" r="8" fill="#febc2e"/>
  <circle cx="112" cy="40" r="8" fill="#28c840"/>
  <text x="640" y="47" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#8a8a8a">vectors — zsh</text>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.80s" dur="0.25s" fill="freeze"/>
    <text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors --version</tspan></text>
  </g>
  <g opacity="0">
