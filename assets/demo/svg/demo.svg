    <text x="44" y="158" fill="#9ca3af">vectors 0.1.0</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.90s" dur="0.25s" fill="freeze"/>
    <text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors logo.png logo.svg --colors 8</tspan></text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.45s" dur="0.25s" fill="freeze"/>
    <text x="44" y="222" fill="#9ca3af">raster → preprocess → segment → contour</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.00s" dur="0.25s" fill="freeze"/>
    <text x="44" y="254" fill="#7dd3a8">Wrote logo.svg (3.2 KB)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.55s" dur="0.25s" fill="freeze"/>
    <text x="44" y="286"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors photo.jpg out.svg --colors 1 --threshold 140</tspan></text>
  </g>
