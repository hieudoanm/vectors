    <text x="44" y="318" fill="#7dd3a8">Wrote out.svg (mono silhouette)</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="4.65s" dur="0.25s" fill="freeze"/>
    <text x="44" y="350"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors logo.svg logo.png --width 512</tspan></text>
  </g>
