  <text x="640" y="47" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" fill="#8a8a8a">vectors — zsh</text>
  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="126"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors --version</tspan></text>  <text x="44" y="158" fill="#9ca3af">vectors 0.1.0</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="190"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors logo.png logo.svg --colors 8</tspan></text>  <text x="44" y="222" fill="#9ca3af">raster → preprocess → segment → contour</text>  <text x="44" y="254" fill="#7dd3a8">Wrote logo.svg (3.2 KB)</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="286"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors photo.jpg out.svg --colors 1 --threshold 140</tspan></text>  <text x="44" y="318" fill="#7dd3a8">Wrote out.svg (mono silhouette)</text>  </g>  <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="20"><text x="44" y="350"><tspan fill="#ff8a5c">$</tspan> <tspan fill="#e5e5e5">vectors logo.svg logo.png --width 512</tspan></text>  <text x="44" y="382" fill="#7dd3a8">Wrote logo.png (512px)</text>  </g></svg>
