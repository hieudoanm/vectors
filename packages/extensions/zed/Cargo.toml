[package]
name = "vectors-zed"
version = "0.0.1"
edition = "2021"
description = "Zed extension: convert images to SVG via the vectors CLI"
license = "MIT"
repository = "https://github.com/hieudoanm/vectors"

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "=0.7.0"

[profile.release]
opt-level = "z"
lto = true
