name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli:
    name: CLI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: crates/vectors-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features eval

      - name: Build
        run: cargo build --release --locked

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: vectors
          path: crates/target/release/vectors
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: latest
          name: CLI (latest)
          body_path: crates/vectors-cli/README.md
          files: crates/target/release/vectors

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build vectors-core (wasm)
        working-directory: crates/vectors-core
        run: |
          make build-wasm
          ls -la pkg/

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out
          retention-days: 1

  landing-deploy:
    name: Landing - Deploy
    needs: [landing-build]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
