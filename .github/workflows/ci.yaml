name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cli-quality:
    name: CLI - Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/vectors-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Check Formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          cargo test --locked
          cargo test --locked --features eval

  cli-build:
    name: CLI - Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Release binaries are only needed for the master-branch release job;
    # PRs are covered by the `cli-quality` job.
    if: github.event_name != 'pull_request'
    needs: cli-quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build
        run: cargo build --release --locked -p vectors-cli

      - name: Rename binary for release
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            ubuntu-latest) mv target/release/vectors dist/cli-vectors-x86_64-unknown-linux-gnu ;;
            macos-latest) mv target/release/vectors dist/cli-vectors-aarch64-apple-darwin ;;
            macos-15-intel) mv target/release/vectors dist/cli-vectors-x86_64-apple-darwin ;;
            windows-latest) mv target/release/vectors.exe dist/cli-vectors-x86_64-pc-windows-msvc.exe ;;
          esac

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cli-vectors-${{ matrix.os }}
          path: crates/dist
          if-no-files-found: error
          retention-days: 7

  extension-browser:
    name: Extension - Browser Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build vectors-core (wasm)
        working-directory: crates/vectors-core
        run: make build-wasm

      - name: Install dependencies
        run: pnpm install

      - name: Package extension
        working-directory: packages/extensions/browser
        run: make package

      - name: Prefix artifact names
        run: |
          cd packages/extensions/browser/download
          for f in *; do mv "$f" "extension-browser-$f"; done

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-browser
          path: packages/extensions/browser/download/*
          if-no-files-found: error
          retention-days: 7

  extension-vscode:
    name: Extension - VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build vectors-core (wasm)
        working-directory: crates/vectors-core
        run: make build-wasm

      - name: Install dependencies
        run: pnpm install

      - name: Package extension
        working-directory: packages/extensions/vscode
        run: pnpm package

      - name: Prefix artifact name
        run: mv packages/extensions/vscode/build/vectors-vscode.vsix packages/extensions/vscode/build/extension-vscode-vectors.vsix

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-vscode
          path: packages/extensions/vscode/build/*.vsix
          if-no-files-found: error
          retention-days: 7

  extension-zed:
    name: Extension - Zed Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: packages/extensions/zed

      - name: Package extension
        working-directory: packages/extensions/zed
        run: make package

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-zed
          path: packages/extensions/zed/download/*
          if-no-files-found: error
          retention-days: 7

  extension-jetbrains:
    name: Extension - JetBrains Extension
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+8.0.LTS'

      - name: Cache Gradle
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('packages/extensions/jetbrains/**/*.gradle*', 'packages/extensions/jetbrains/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build plugin
        working-directory: packages/extensions/jetbrains
        run: ./gradlew buildPlugin --no-daemon --console=plain

      - name: Test plugin
        working-directory: packages/extensions/jetbrains
        run: ./gradlew test koverVerify --no-daemon --console=plain

      - name: Prefix artifact name
        run: |
          cd packages/extensions/jetbrains/build/distributions
          for f in *.zip; do mv "$f" "extension-jetbrains-vectors.zip"; done

      - name: Upload extension artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: extension-jetbrains
          path: packages/extensions/jetbrains/build/distributions/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Release
    needs:
      - cli-build
      - extension-browser
      - extension-vscode
      - extension-zed
      - extension-jetbrains
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: cli-vectors-*
          merge-multiple: true

      - name: Download extension artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: extension-*
          merge-multiple: true

      - name: List artifacts to verify
        run: ls -la dist/

      - name: Delete existing latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/latest || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest dist/* \
            --title "vectors (latest)" \
            --notes-file RELEASE.md \
            --target "${{ github.sha }}"

  landing-build:
    name: Landing - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/landing
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3

      - name: Build vectors-core (wasm)
        working-directory: crates/vectors-core
        run: |
          make build-wasm
          ls -la pkg/

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: packages/landing/out
          retention-days: 1

  landing-deploy:
    name: Landing - Deploy
    needs:
      - landing-build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5.0.1
